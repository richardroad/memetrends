<title>Прибор</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed instrument screen; a rail of instruments on top, one glass console bottom-left for source and dials. */
:root {
  --ink: #ebeef2;
  --ink-dim: #9aa3ad;
  --ink-faint: #5e6670;
  --glass: rgba(8, 10, 12, 0.64);
  --line: rgba(210, 220, 230, 0.14);
  --stage: #030405;
  --accent: #ff9a3c;
  --f-display: "Unbounded", "Manrope", system-ui, sans-serif;
  --f-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--stage); color: var(--ink); font-family: var(--f-body); overflow: hidden; }
canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: var(--stage); touch-action: none; }
.ui { transition: opacity .3s ease; }
body.ui-hidden .ui { opacity: 0; pointer-events: none; }

.top { position: fixed; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top, 0px) + 14px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); display: flex; gap: 16px; align-items: center; flex-wrap: wrap; pointer-events: none; }
.brand { font-family: var(--f-display); font-weight: 600; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
.brand i { width: 10px; height: 10px; border: 2px solid var(--accent); border-radius: 50%; box-shadow: 0 0 12px var(--accent); transition: border-color .5s, box-shadow .5s; }
.modes { display: flex; gap: 5px; flex-wrap: wrap; pointer-events: auto; }
.modes button { font-family: var(--f-body); font-size: 12px; font-weight: 600; color: var(--ink-dim); background: var(--glass); border: 1px solid var(--line); padding: 7px 11px 7px 9px; border-radius: 999px; cursor: pointer; display: flex; gap: 7px; align-items: center; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.modes button kbd { font-family: var(--f-mono); font-size: 10px; color: var(--ink-faint); }
.modes button:hover { color: var(--ink); }
.modes button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--stage); }
.modes button[aria-pressed="true"] kbd { color: rgba(3,4,5,.55); }

.console { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); width: 320px; max-width: calc(100vw - 32px); max-height: calc(100vh - 110px); overflow-y: auto; background: var(--glass); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px 16px; display: grid; gap: 11px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.console h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 19px; }
.desc { margin: -4px 0 0; font-size: 12px; color: var(--ink-dim); line-height: 1.5; }
.lbl { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-faint); border-top: 1px solid var(--line); padding-top: 10px; }
.src-name { font-size: 11.5px; color: var(--ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ctl { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; }
.ctl label { font-size: 12.5px; }
.ctl output { font-family: var(--f-mono); font-size: 11px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.ctl input { grid-column: 1 / -1; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 2px; background: linear-gradient(90deg, var(--accent) var(--p, 50%), rgba(210,220,230,.18) var(--p, 50%)); border-radius: 2px; }
input[type=range]::-moz-range-track { height: 2px; background: rgba(210,220,230,.18); }
input[type=range]::-moz-range-progress { height: 2px; background: var(--accent); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -6px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 3px rgba(3,4,5,.6); }
input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--ink); border: 0; }
input[type=range]:focus-visible { outline: 1px dashed var(--accent); outline-offset: 3px; }
.row { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
.btn { font-family: var(--f-body); font-size: 12px; font-weight: 600; color: var(--ink); background: rgba(210,220,230,.08); border: 1px solid var(--line); border-radius: 8px; padding: 8px 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
.btn:hover { background: rgba(210,220,230,.16); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--stage); }
.btn.rec { color: #ff6b6b; }
.btn.rec.on { background: #ff4d4d; border-color: #ff4d4d; color: #fff; }
.btn[disabled] { opacity: .4; cursor: default; }
.btn kbd { font-family: var(--f-mono); font-size: 10px; opacity: .6; }
.btn:focus-visible, .modes button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.check { display: inline-flex; gap: 8px; align-items: center; font-size: 12px; color: var(--ink-dim); cursor: pointer; }
.check input { accent-color: var(--accent); }
.hint { margin: 0; font-size: 11px; color: var(--ink-faint); line-height: 1.55; }
.hint kbd { font-family: var(--f-mono); color: var(--ink-dim); }
.show-ui { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); opacity: 0; pointer-events: none; }
body.ui-hidden .show-ui { opacity: .35; pointer-events: auto; }
body.ui-hidden .show-ui:hover { opacity: 1; }
.fab { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); display: none; }
.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 60px); transform: translateX(-50%); background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-size: 12.5px; backdrop-filter: blur(10px); opacity: 0; transition: opacity .25s; pointer-events: none; max-width: calc(100vw - 32px); text-align: center; }
.toast.show { opacity: 1; }
.fail { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--ink-dim); }
@media (max-width: 720px) {
  .console { right: max(16px, env(safe-area-inset-right, 0px)); width: auto; max-height: 55vh; bottom: calc(env(safe-area-inset-bottom, 0px) + 64px); }
  body.collapsed .console { display: none; }
  .fab { display: inline-flex; }
}
@media (prefers-reduced-motion: reduce) { .ui, .toast { transition: none; } }
</style>

<canvas id="gl" aria-label="Экран прибора"></canvas>
<header class="top ui">
  <div class="brand"><i></i>Прибор</div>
  <nav class="modes" id="modes" aria-label="Приборы"></nav>
</header>

<aside class="console ui" aria-label="Пульт прибора">
  <h2 id="modeName"></h2>
  <p class="desc" id="modeDesc"></p>

  <div class="lbl">Материал</div>
  <div class="row">
    <label class="btn primary" for="file" style="cursor:pointer">Загрузить видео или фото</label>
    <input type="file" id="file" accept="video/*,image/*" hidden>
    <button class="btn" id="demoBtn" type="button">Демо</button>
    <button class="btn" id="playBtn" type="button" hidden>Пауза</button>
  </div>
  <div class="src-name" id="srcName">Демо: дым в вихре. Загрузи своё, снятое на телефон.</div>

  <div class="lbl">Настройка</div>
  <div id="ctls" style="display:grid;gap:9px"></div>
  <label class="check" for="hudOn"><input type="checkbox" id="hudOn" checked> Шкалы и подписи прибора</label>

  <div class="row">
    <button class="btn" id="shotBtn" type="button">Сохранить кадр</button>
    <button class="btn rec" id="recBtn" type="button">● Запись</button>
    <button class="btn" id="fsBtn" type="button">Экран <kbd>F</kbd></button>
    <button class="btn" id="hideBtn" type="button">Скрыть <kbd>H</kbd></button>
  </div>
  <p class="hint" id="saveHint"><kbd>1–8</kbd> приборы · <kbd>Пробел</kbd> пауза видео · <kbd>H</kbd> скрыть пульт · <kbd>F</kbd> полный экран</p>
</aside>
<button class="btn show-ui" id="showUi" type="button">Пульт</button>
<div class="fab ui"><button class="btn" id="collapseBtn" type="button">Пульт</button></div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const MODES = [
  { key: "thermal", name: "Тепловизор", accent: "#ff9a3c", desc: "Видно тепло, а не свет. Яркое горячее, тёмное холодное. Для Платины: иней как холод, съедающий тепло.",
    a: ["Чувствительность", .45], b: ["Палитра", 0, v => v < .34 ? "железо" : v < .67 ? "радуга" : "белый горячий"] },
  { key: "radar", name: "Метеорадар", accent: "#5fe39a", desc: "Луч развёртки обходит круг и обновляет эхо. Режим скорости красит ветер красным и зелёным. Для Саши Вортекс.",
    a: ["Скорость луча", .3], b: ["Режим", 0, v => v < .5 ? "отражаемость" : "скорость ветра"] },
  { key: "sem", name: "Микроскоп", accent: "#d9dde2", desc: "Электронный микроскоп: чёрно-белый рельеф, светящиеся края, шум развёртки. Масштаб становится неясен.",
    a: ["Рельеф", .5], b: ["Увеличение", .15, v => "×" + Math.round(500 * (1 + v * 4))] },
  { key: "slit", name: "Щель времени", accent: "#b48cff", desc: "Каждая часть кадра показывает своё мгновение. Спираль закручивает само время в вихрь.",
    a: ["Глубина времени", .6], b: ["Форма", .55, v => ["строки", "круг", "спираль", "столбцы"][Math.min(3, Math.floor(v * 4))]] },
  { key: "mosh", name: "Датамош", accent: "#ff5fa2", desc: "Движение нового кадра тащит пиксели старого. Как сломанное сжатие видео. Нужен движущийся материал.",
    a: ["Текучесть", .65], b: ["Размер блоков", .2, v => Math.round(8 + v * 40) + " px"] },
  { key: "moire", name: "Муар", accent: "#7fd6ff", desc: "Две сетки линий накладываются и дают интерференцию. Как экран, переснятый на телефон.",
    a: ["Частота линий", .35], b: ["Угол сеток", .3] },
  { key: "diff", name: "Дифракция", accent: "#ffe15c", desc: "Яркие точки раскладываются в спектр, как свет на поверхности CD-диска.",
    a: ["Длина лучей", .5], b: ["Угол", .2] },
  { key: "crt", name: "Кинескоп", accent: "#ff6b4a", desc: "Старый телевизор и магнит у экрана: картинка закручивается радужным вихрем. Тяни магнит пальцем или мышью.",
    a: ["Сила магнита", .65], b: ["Развёртка", .5] },
];
const S = { mode: 0, hud: true, mix: 0, p: MODES.map(m => ({ a: m.a[1], b: m.b[1] })) };
try { const o = JSON.parse(localStorage.getItem("pribor") || "null"); if (o && o.p && o.p.length === MODES.length) Object.assign(S, o); } catch (e) {}
const save = () => { try { localStorage.setItem("pribor", JSON.stringify(S)); } catch (e) {} };

/* ---------------- GL ---------------- */
const canvas = document.getElementById("gl");
const gl = canvas.getContext("webgl2", { antialias: false, alpha: false, preserveDrawingBuffer: false });
if (!gl) { document.body.insertAdjacentHTML("beforeend", '<div class="fail">Нужен WebGL2. Откройте страницу в свежем Chrome, Safari или Firefox.</div>'); return; }

const VERT = `#version 300 es
in vec2 aPos; out vec2 vUv; void main(){ vUv=aPos*.5+.5; gl_Position=vec4(aPos,0.,1.); }`;
const HEAD = `#version 300 es
precision highp float;
precision highp sampler2DArray;
in vec2 vUv; out vec4 o;
float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),u.x), mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),u.x), u.y); }
float fbm(vec2 p){ float v=0., a=.5; mat2 m=mat2(1.6,1.2,-1.2,1.6); for(int i=0;i<5;i++){ v+=a*noise(p); p=m*p; a*=.5; } return v; }
float L(vec3 c){ return dot(c,vec3(.299,.587,.114)); }
mat2 rot(float a){ return mat2(cos(a),-sin(a),sin(a),cos(a)); }
`;
const SRC_FS = HEAD + `
uniform sampler2D uIn; uniform vec2 uScale, uRes; uniform float uDemo, uTime;
vec3 demo(vec2 uv){
  vec2 p=(uv-.5)*vec2(uRes.x/uRes.y,1.);
  float t=uTime, r=length(p);
  float ang=t*.22+1.5/(r+.35);
  vec2 q=rot(ang)*p;
  float s=fbm(q*2.6+vec2(0.,-t*.15))*.7+fbm(q*7.-t*.1)*.3;
  float smoke=smoothstep(.38,.85,s)*smoothstep(.8,.12,r);
  vec2 b1=vec2(sin(t*.37)*.42, cos(t*.29)*.18);
  vec2 b2=vec2(cos(t*.21)*.5, sin(t*.33)*.25-.05);
  float hot=exp(-length(p-b1)*7.)*.9+exp(-length((p-b2)*vec2(1.,.45))*5.)*.55;
  float core=exp(-r*10.)*.9;
  float streak=exp(-abs(p.y+.32+.05*sin(p.x*3.+t))*60.)*smoothstep(.9,.2,abs(p.x))*.6;
  return vec3(smoke*.7)+vec3(1.,.93,.85)*(hot+core)+vec3(.9)*streak;
}
void main(){
  vec3 c = uDemo>.5 ? demo(vUv) : texture(uIn,(vUv-.5)*uScale+.5).rgb;
  o=vec4(c,1.);
}`;
const COPY_FS = HEAD + `uniform sampler2D uIn; void main(){ o=texture(uIn,vUv); }`;
const FX_FS = HEAD + `
uniform sampler2D uSrc, uPrev, uFb; uniform sampler2DArray uHist;
uniform vec2 uRes, uMag;
uniform float uMode, uA, uB, uTime, uHead, uN, uSweep, uSweepPrev, uSeed;
float Ls(vec2 uv){ return L(texture(uSrc,uv).rgb); }
vec3 iron(float t){
  t=clamp(t,0.,1.);
  if(t<.2) return mix(vec3(0.),vec3(.13,0.,.38),t/.2);
  if(t<.45) return mix(vec3(.13,0.,.38),vec3(.62,.03,.45),(t-.2)/.25);
  if(t<.7) return mix(vec3(.62,.03,.45),vec3(.96,.36,.05),(t-.45)/.25);
  if(t<.88) return mix(vec3(.96,.36,.05),vec3(1.,.82,.2),(t-.7)/.18);
  return mix(vec3(1.,.82,.2),vec3(1.),(t-.88)/.12);
}
vec3 hueT(float h){ return clamp(abs(fract(h+vec3(0.,.333,.667))*6.-3.)-1.,0.,1.); }
vec3 rainbowT(float t){ t=clamp(t,0.,1.); return hueT(.66-t*.72)*smoothstep(0.,.1,t)+vec3(1.)*smoothstep(.93,1.,t); }
vec3 spectrum(float t){ return hueT(t*.8); }
vec3 radarPal(float l){
  if(l<.14) return vec3(0.);
  if(l<.26) return vec3(.0,.55,.78);
  if(l<.38) return vec3(.0,.82,.32);
  if(l<.5)  return vec3(.0,.5,.15);
  if(l<.62) return vec3(1.,.9,0.);
  if(l<.74) return vec3(1.,.55,0.);
  if(l<.86) return vec3(.95,.1,.1);
  return vec3(.85,.25,.95);
}
float moire(vec2 p, float l, float fq, vec2 d2, float ph){
  float g1=.5+.5*sin(p.y*fq+l*9.+ph);
  float g2=.5+.5*sin(dot(p,d2)*fq*1.02+ph*.5+uTime*.3);
  return g1*g2;
}
void main(){
  vec2 uv=vUv; vec2 px=1./uRes; float asp=uRes.x/uRes.y;
  vec3 src=texture(uSrc,uv).rgb;
  int m=int(uMode+.5);
  if(uSeed>.5){ o=vec4(m==1 ? vec3(0.) : src,1.); return; }
  vec3 c=src;
  if(m==0){
    vec2 g=vec2(480.,480./asp);
    vec2 q=(floor(uv*g)+.5)/g;
    float l=(Ls(q)*2.+Ls(q+px*3.)+Ls(q-px*3.)+Ls(q+vec2(px.x,-px.y)*3.)+Ls(q+vec2(-px.x,px.y)*3.))/6.;
    float t=clamp((l-.5)*(1.+uA*4.)+.5,0.,1.);
    t=mix(t,t*t*(3.-2.*t),.4);
    c = uB<.34 ? iron(t) : (uB<.67 ? rainbowT(t) : vec3(t));
    c += (hash(uv*uRes+fract(uTime)*91.)-.5)*.035;
    c *= .975+.025*sin(uv.x*uRes.x*.5);
  } else if(m==1){
    vec2 p=(uv-.5)*vec2(asp,1.); float r=length(p)/.46; float a=atan(p.y,p.x);
    vec3 prevO=texture(uFb,uv).rgb*.994;
    float d=mod(uSweep-a,6.28318); float span=mod(uSweep-uSweepPrev,6.28318)+.003;
    if(d<span && r<1.){
      float l=Ls(uv)*(.8+.4*noise(uv*90.+uTime*.5));
      vec3 refl=radarPal(floor(l*8.)/8.);
      vec2 gr=vec2(Ls(uv+vec2(px.x*3.,0.))-Ls(uv-vec2(px.x*3.,0.)), Ls(uv+vec2(0.,px.y*3.))-Ls(uv-vec2(0.,px.y*3.)));
      float v=dot(normalize(p+1e-4),gr)*28.;
      float lv=Ls(uv);
      vec3 vel=(v>0. ? vec3(1.,.18,.12) : vec3(.12,1.,.35))*clamp(abs(v),0.,1.)*step(.1,lv)*(.4+lv);
      c = uB<.5 ? refl : vel;
    } else c=prevO;
  } else if(m==2){
    float z=1.+uB*4.; vec2 zuv=(uv-.5)/z+.5;
    float line=floor(uv.y*uRes.y*.5);
    zuv.x+=(step(.985,hash(vec2(line,floor(uTime*12.))))-0.)*.004*(hash(vec2(line,3.))-.5);
    vec2 e=1.5*px/z;
    float l=Ls(zuv);
    vec2 g=vec2(Ls(zuv+vec2(e.x,0.))-Ls(zuv-vec2(e.x,0.)), Ls(zuv+vec2(0.,e.y))-Ls(zuv-vec2(0.,e.y)));
    float edge=length(g)*(4.+uA*14.);
    float shade=dot(g,vec2(-.7,.7))*(3.+uA*10.);
    float v=l*.55+edge*.8+shade*.5+.06;
    v=pow(clamp(v,0.,1.),1.15);
    v+=(hash(vec2(line,floor(uTime*24.)))-.5)*.05+(hash(uv*uRes+uTime)-.5)*.08;
    c=vec3(v);
  } else if(m==3){
    vec2 p=(uv-.5)*vec2(asp,1.);
    float f;
    if(uB<.25) f=1.-uv.y;
    else if(uB<.5) f=clamp(length(p)/.85,0.,1.);
    else if(uB<.75) f=fract(length(p)*1.6-atan(p.y,p.x)/6.28318+uTime*.02);
    else f=uv.x;
    float off=f*uA*(uN-2.);
    float fl=floor(off), fr=off-fl;
    float l0=mod(uHead-fl+uN,uN), l1=mod(uHead-fl-1.+uN,uN);
    c=mix(texture(uHist,vec3(uv,l0)).rgb, texture(uHist,vec3(uv,l1)).rgb, fr);
  } else if(m==4){
    vec2 bs=(8.+uB*40.)*px;
    vec2 buv=(floor(uv/bs)+.5)*bs;
    float c0=Ls(buv), p0=L(texture(uPrev,buv).rgb);
    vec2 g=vec2(Ls(buv+vec2(bs.x,0.))-Ls(buv-vec2(bs.x,0.)), Ls(buv+vec2(0.,bs.y))-Ls(buv-vec2(0.,bs.y)));
    float dt=c0-p0;
    vec2 flow=clamp(-dt*g/(dot(g,g)+.002)*bs*.6, -bs*2., bs*2.);
    vec3 moshed=texture(uFb, uv-flow*(1.+uA*3.)).rgb;
    float keep=.9+uA*.095;
    c=mix(src,moshed,keep);
  } else if(m==5){
    vec2 p=(uv-.5)*vec2(asp,1.);
    float l=Ls(uv);
    float fq=80.+uA*520.;
    float rr=uB*.3+.015;
    vec2 d2=vec2(sin(rr),cos(rr));
    c=vec3(moire(p,l,fq,d2,0.), moire(p,l,fq,d2,2.094), moire(p,l,fq,d2,4.189));
    c*=.2+l*1.5;
  } else if(m==6){
    vec3 base=src*.55;
    float ang=uB*3.14159+uTime*.04;
    vec2 d=vec2(cos(ang),sin(ang))*vec2(1./asp,1.)*(.003+uA*.012);
    vec2 dp=vec2(-d.y*asp,d.x/asp)*.6;
    vec3 acc=vec3(0.);
    for(int i=1;i<=24;i++){
      float fi=float(i)/24.;
      vec3 sp=spectrum(fi);
      float b1=max(L(texture(uSrc,uv-d*float(i)).rgb)-.72,0.);
